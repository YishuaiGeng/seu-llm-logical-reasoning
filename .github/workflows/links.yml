name: External link check

on:
  schedule:
    - cron: '17 1 1 * *'  # 每月 1 日 09:17（北京时间）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --accept 200,206,429
            --exclude '^https://github\.com/YishuaiGeng/seu-llm-logical-reasoning/(edit|new)/'
            './**/*.md' 'overrides/**/*.html'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '[修正] 每月外部链接检查发现失效链接'
          content-filepath: ./lychee/out.md
          labels: bug
