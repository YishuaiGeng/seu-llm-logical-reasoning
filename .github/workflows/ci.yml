name: Documentation checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs and check examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 页面更新日期来自完整 Git 历史
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          for file in examples/*/requirements.txt; do python -m pip install -r "$file"; done
      - name: Check frontmatter
        run: python scripts/check_content.py
      - name: Build site
        run: mkdocs build --strict
      - name: Check rendered links
        run: python scripts/check_site.py
      - name: Run example self-checks
        run: python scripts/run_examples.py
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 7
